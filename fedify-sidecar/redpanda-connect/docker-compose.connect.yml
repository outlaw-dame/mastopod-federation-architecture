# Redpanda Connect overlay — auxiliary pipelines only.
#
# Usage (local dev, compose v2):
#   docker compose \
#     -f docker-compose.v6.yml \
#     -f redpanda-connect/docker-compose.connect.yml \
#     up
#
# OS4 boundary:
# - SearchIndexerService is the sole ap.firehose.v1 -> public search projector.
# - redpanda-connect/streams/ no longer contains the historical duplicate
#   firehose -> ap-activities pipeline.
# - archived pipelines live under redpanda-connect/archive/ and are not loaded by
#   the streams-mode glob below.
#
# Prometheus metrics: http://localhost:4195/metrics

services:
  # ============================================================================
  # OpenSearch (shared auxiliary search/audit dependency)
  # ============================================================================
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: fedify-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 8
    networks:
      - fedify

  # ============================================================================
  # LocalStack (S3 emulation for local dev / CI)
  # ============================================================================
  localstack:
    image: localstack/localstack:3
    container_name: fedify-localstack
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - DISABLE_PRO_FEATURES=1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"'"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - fedify

  init-localstack:
    image: amazon/aws-cli:latest
    container_name: fedify-init-localstack
    entrypoint: sh
    command: >
      -c "aws --endpoint-url http://localstack:4566 s3 mb s3://${S3_ARCHIVE_BUCKET:-fedify-archive} 2>/dev/null || true &&
          echo '[init-localstack] bucket ready: ${S3_ARCHIVE_BUCKET:-fedify-archive}'"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - fedify
    restart: "no"

  # ============================================================================
  # Redpanda Connect — auxiliary pipelines only
  # ============================================================================
  redpanda-connect:
    image: redpandadata/connect:latest
    container_name: fedify-rpconnect
    command: ["streams", "--config", "/redpanda-connect/config.yaml", "/redpanda-connect/streams/*.yaml"]
    volumes:
      - ./config.yaml:/redpanda-connect/config.yaml:ro
      - ./streams:/redpanda-connect/streams:ro
    environment:
      REDPANDA_BROKER: "redpanda:9092"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_AUTH_ENABLED: "false"
      OPENSEARCH_USER: "${OPENSEARCH_USER:-admin}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:-admin}"
      S3_ARCHIVE_BUCKET: "${S3_ARCHIVE_BUCKET:-fedify-archive}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://localstack:4566}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-test}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-test}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "4195:4195"
    depends_on:
      redpanda:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      init-localstack:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4195/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fedify
      - activitypods
    restart: unless-stopped

volumes:
  opensearch_data:
  localstack_data:

networks:
  fedify:
    driver: bridge
  activitypods:
    external: true
    name: activitypods-network
