version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fedify-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fedify

  redpanda:
    image: vectorized/redpanda:latest
    container_name: fedify-redpanda
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      REDPANDA_BROKERS: redpanda:9092
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --advertised-kafka-api=redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fedify

  # Tier-3 rebuildable public-query projection. OS2 selected lexical/faceted
  # OpenSearch as the current runtime; vector search is not an active requirement.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: fedify-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      cluster.name: fedify-search
      node.name: os-node-1
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - fedify

  # Future/experimental vector companion only. It is deliberately outside the
  # default runtime and starts only with: docker compose --profile vector-experimental up
  qdrant:
    profiles: ['vector-experimental']
    image: qdrant/qdrant:v1.19.0
    container_name: fedify-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6333/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fedify

  fedify-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fedify-sidecar-v6
    ports:
      - '8080:8080'
    environment:
      SIDECAR_PORT: '8080'
      SIDECAR_HOST: '0.0.0.0'
      SIDECAR_BASE_URL: 'http://localhost:8080'

      ACTIVITYPODS_URL: 'http://activitypods:3000'
      ACTIVITYPODS_TOKEN: '${ACTIVITYPODS_TOKEN}'

      REDIS_URL: 'redis://redis:6379'
      MAX_CONCURRENT_PER_DOMAIN: '5'
      IDEMPOTENCY_TTL_MS: '86400000'
      RATE_LIMIT_WINDOW_MS: '3600000'
      RATE_LIMIT_MAX_PER_WINDOW: '1000'
      ACTOR_CACHE_TTL_MS: '3600000'

      REDPANDA_BROKERS: 'redpanda:9092'
      REDPANDA_CLIENT_ID: 'fedify-sidecar-v6'
      REDPANDA_COMPRESSION: 'zstd'

      STREAM1_TOPIC: 'ap.stream1.local-public.v1'
      STREAM2_TOPIC: 'ap.stream2.remote-public.v1'
      FIREHOSE_TOPIC: 'ap.firehose.v1'
      OUTBOUND_TOPIC: 'ap.outbound.v1'
      INBOUND_TOPIC: 'ap.inbound.v1'
      MRF_REJECTED_TOPIC: 'ap.mrf.rejected.v1'
      TOMBSTONES_TOPIC: 'ap.tombstones.v1'

      INBOUND_CONSUMER_GROUP: 'fedify-inbound-v6'
      OUTBOUND_CONSUMER_GROUP: 'fedify-outbound-v6'
      INDEXER_CONSUMER_GROUP: 'fedify-indexer-v6'

      # OS3 active search architecture.
      SEARCH_BACKEND: 'opensearch'
      OPENSEARCH_URL: 'http://opensearch:9200'
      OPENSEARCH_SSL_VERIFY: 'false'
      ENABLE_OPENSEARCH_INDEXER: 'true'

      ENABLE_INBOUND_WORKER: 'true'
      ENABLE_OUTBOUND_WORKER: 'true'
      INBOUND_CONCURRENCY: '10'
      OUTBOUND_CONCURRENCY: '20'
      REQUEST_TIMEOUT_MS: '30000'

      ENABLE_MRF: 'true'
      MRF_POLICY_SIGNATURE_VALIDATION: 'true'
      MRF_POLICY_BLOCKED_DOMAIN: 'true'
      MRF_POLICY_SUSPICIOUS_ACTIVITY: 'true'

      LOG_LEVEL: 'info'
      LOG_FORMAT: 'json'

    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - fedify
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5

