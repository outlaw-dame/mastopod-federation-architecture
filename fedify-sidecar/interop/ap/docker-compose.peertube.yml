services:
  peertube-db:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    environment:
      POSTGRES_DB: peertube
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: ${PEERTUBE_DB_PASSWORD:?PEERTUBE_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertube -d peertube"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ap_interop_peertube_db:/var/lib/postgresql/data
    networks:
      - ap-interop

  peertube-redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ap_interop_peertube_redis:/data
    networks:
      - ap-interop

  peertube-app:
    image: chocobozzz/peertube:v8.2.4@sha256:b4e49e7ca29ba79d8ae145d76d7a5cad612f096bfa0b9aea0138e86728a6ee50
    depends_on:
      peertube-db:
        condition: service_healthy
      peertube-redis:
        condition: service_healthy
    environment:
      PEERTUBE_DB_HOSTNAME: peertube-db
      PEERTUBE_DB_PORT: "5432"
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: ${PEERTUBE_DB_PASSWORD:?PEERTUBE_DB_PASSWORD is required}
      PEERTUBE_DB_NAME: peertube
      PEERTUBE_DB_SSL: "false"
      PEERTUBE_REDIS_HOSTNAME: peertube-redis
      PEERTUBE_REDIS_PORT: "6379"
      PEERTUBE_WEBSERVER_HOSTNAME: peertube.test
      PEERTUBE_WEBSERVER_PORT: "443"
      PEERTUBE_WEBSERVER_HTTPS: "true"
      PEERTUBE_SECRET: ${PEERTUBE_SECRET:?PEERTUBE_SECRET is required}
      PEERTUBE_ADMIN_EMAIL: interop@peertube.invalid
      PEERTUBE_SMTP_HOSTNAME: 127.0.0.1
      PEERTUBE_SMTP_PORT: "25"
      PEERTUBE_SMTP_FROM: noreply@peertube.test
      PEERTUBE_SMTP_TLS: "false"
      PEERTUBE_SMTP_DISABLE_STARTTLS: "true"
      PEERTUBE_LOG_LEVEL: info
      NODE_EXTRA_CA_CERTS: /interop/runtime/certs/rootCA.crt
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/v1/config >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - ap_interop_peertube_data:/data
      - ap_interop_peertube_config:/config
      - ./runtime/certs:/interop/runtime/certs:ro
    networks:
      - ap-interop

volumes:
  ap_interop_peertube_db:
  ap_interop_peertube_redis:
  ap_interop_peertube_data:
  ap_interop_peertube_config:
