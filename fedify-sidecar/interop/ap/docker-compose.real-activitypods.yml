services:
  ap-proof-router:
    image: caddy:2.8-alpine
    profiles: ["real-activitypods"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile.real-activitypods:/etc/caddy/Caddyfile:ro
      - ./runtime/certs:/certs:ro
    ports:
      - "127.0.0.1:443:443"
    networks:
      ap-interop:
        aliases:
          - activitypods
          - mastodon

  # Optional containerized sidecar override for manual real-ActivityPods runs.
  # The authoritative two-mode CI proof starts the sidecar on the host instead,
  # so the native control lane never depends on this service.
  fedify-sidecar:
    environment:
      ACTIVITYPODS_URL: http://host.docker.internal:3001
      ACTIVITYPODS_TOKEN: ${ACTIVITYPODS_TOKEN:?ACTIVITYPODS_TOKEN is required}
      ATPROTO_PASSWORD_VERIFY_TOKEN: ${ATPROTO_PASSWORD_VERIFY_TOKEN:-}
      DOMAIN: activitypods
      AP_RELAY_LOCAL_ACTOR_URI: https://activitypods/users/relay
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
