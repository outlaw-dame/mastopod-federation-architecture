services:
  mastodon-wire-recorder:
    build:
      context: ../..
      dockerfile: Dockerfile.interop
    working_dir: /app
    command: ["node", "interop/ap/scripts/activitypub-wire-recording-proxy.mjs"]
    environment:
      NODE_ENV: test
      AP_WIRE_RECORDER_HOST: 0.0.0.0
      AP_WIRE_RECORDER_PORT: "8788"
      AP_WIRE_RECORDER_UPSTREAM: http://mastodon-web-app:3000
      AP_WIRE_RECORDER_EVIDENCE_PATH: /evidence/mastodon.jsonl
      AP_WIRE_RECORDER_MAX_BODY_BYTES: "2097152"
      AP_WIRE_RECORDER_MAX_RESPONSE_BYTES: "4194304"
    volumes:
      - ./runtime/wire:/evidence
    networks:
      - ap-interop

  gotosocial-wire-recorder:
    build: { context: ../.., dockerfile: Dockerfile.interop }
    working_dir: /app
    command: ["node", "interop/ap/scripts/activitypub-wire-recording-proxy.mjs"]
    environment: { NODE_ENV: test, AP_WIRE_RECORDER_HOST: 0.0.0.0, AP_WIRE_RECORDER_PORT: "8788", AP_WIRE_RECORDER_UPSTREAM: "http://gotosocial-app:8080", AP_WIRE_RECORDER_EVIDENCE_PATH: "/evidence/gotosocial.jsonl" }
    volumes: ["./runtime/wire:/evidence"]
    networks: [ap-interop]

