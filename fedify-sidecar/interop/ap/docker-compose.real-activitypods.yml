    volumes: ["./runtime/wire:/evidence"]
    networks: [ap-interop]

  ap-proof-router:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    profiles: ["real-activitypods"]
    depends_on:
      mastodon-wire-recorder:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACTIVITYPODS_RETURN_HOST: ${ACTIVITYPODS_RETURN_HOST:-host.docker.internal}
      ACTIVITYPODS_RETURN_PORT: ${ACTIVITYPODS_RETURN_PORT:-3000}
    volumes:
      - ./caddy/Caddyfile.real-activitypods:/etc/caddy/Caddyfile:ro
      - ./runtime/certs:/certs:ro
    ports:
      - "127.0.0.1:443:443"
    networks:
      ap-interop:
        # Keep the proof router address deterministic so the Friendica-only
        # authoritative DNS fixture can publish a real A record. This remains
        # inside the test network's dedicated RFC1918 subnet.
        ipv4_address: 172.31.240.254
        aliases:
          - sidecar
          - activitypods
          - gotosocial
          - mastodon
          - akkoma
          - pixelfed.test
          - bonfire.test
          - misskey.test
          - friendica.test
          - castopod.test
          - peertube.test
          - loops.test
          - owncast.test
          - activitypods.test

  # Containerized real-ActivityPods sidecar proof. Keeping this service on the
  # interop network lets the existing development-only private-host allowlist
  # exercise HTTPS federation without weakening the production SSRF policy.
  fedify-sidecar:
    environment:
      # The real proof needs the debug-only post-forward receipt so evidence can
      # bind a raw Redis envelope to successful ActivityPods forwarding without
      # restoring high-cardinality success logs to normal production info level.
      LOG_LEVEL: debug
      # Directional, Docker-network-only alias for the host signing recorder.
      # The public ActivityPods actor/key surface remains HTTPS through
      # ap-proof-router, while sidecar-owned service actors are published on the
      # independently routed https://sidecar authority.
      ACTIVITYPODS_URL: http://activitypods-internal:3001
      ACTIVITYPODS_PUBLIC_URL: https://activitypods
      ACTIVITYPODS_TOKEN: ${ACTIVITYPODS_TOKEN:?ACTIVITYPODS_TOKEN is required}
      ATPROTO_PASSWORD_VERIFY_TOKEN: ${ATPROTO_PASSWORD_VERIFY_TOKEN:-}
      SIDECAR_TOKEN: ${SIDECAR_TOKEN:?SIDECAR_TOKEN is required}
      SIDECAR_STARTUP_MODE: blocking
      DOMAIN: sidecar
      AP_RELAY_LOCAL_ACTOR_URI: https://sidecar/users/relay
      REDIS_STREAM_PAYLOAD_COMPRESSION_ENABLED: "true"
      REDIS_STREAM_PAYLOAD_COMPRESSION_MIN_BYTES: "1"
      REDIS_STREAM_PAYLOAD_BROTLI_QUALITY: "0"
      ENABLE_INBOUND_WORKER: ${AP_INTEROP_ENABLE_INBOUND_WORKER:-false}
      ENABLE_OUTBOUND_WORKER: "true"
      ENABLE_OUTBOX_INTENT_WORKER: "true"
      # Required for the same runtime that performs outbound delivery to also
      # publish /users/relay and its locally-managed public key. This is the
      # production service-actor authority path under test, not a fixture-only
      # actor document.
      ENABLE_FEDIFY_RUNTIME_INTEGRATION: "true"
      ENABLE_FEP_3AB2_STREAMING: "false"
      ENABLE_OPENSEARCH_INDEXER: "false"
      ENABLE_XRPC_SERVER: "false"
      ENABLE_MEDIA_ASSET_SYNC: "false"
      ENABLE_ACCOUNT_PROVISIONING: "false"
      ENABLE_ENTRYWAY: "false"
      ENABLE_FOLLOWERS_SYNC: "false"
      ENABLE_MRF_ADMIN_API: "false"
      ENABLE_MODERATION_BRIDGE_API: "false"
      ENABLE_CANONICAL_EVENT_LOG: "false"
      ENABLE_CANONICAL_NOTIFICATIONS: "false"
      ENABLE_AT_JETSTREAM: "false"
      ENABLE_AT_EXTERNAL_FIREHOSE: "false"
    extra_hosts:
      - "activitypods-internal:${AP_SIGNING_PROXY_DOCKER_HOST:-host-gateway}"
    ports:
      - "127.0.0.1:8080:8080"
