<IfModule mpm_prefork_module>
    StartServers 10
    MinSpareServers 5
    MaxSpareServers 20
    ServerLimit 50
    MaxRequestWorkers 50
</IfModule>
<IfModule mpm_event_module>
    StartServers 4
    MinSpareThreads 25
    MaxSpareThreads 75
    ThreadLimit 64
    ThreadsPerChild 25
    MaxRequestWorkers 150
</IfModule>
