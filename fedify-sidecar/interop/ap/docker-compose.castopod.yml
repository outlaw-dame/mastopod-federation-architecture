services:
  castopod-db:
    image: mariadb:11.4@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
    environment:
      MARIADB_DATABASE: castopod
      MARIADB_USER: castopod
      MARIADB_PASSWORD: ${CASTOPOD_DB_PASSWORD:?CASTOPOD_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${CASTOPOD_DB_ROOT_PASSWORD:?CASTOPOD_DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ap_interop_castopod_db:/var/lib/mysql
    networks:
      - ap-interop

  castopod-redis:
    image: redis:7-alpine
    # Castopod's cache-service bootstrap fails with an unrelated-looking
    # "Undefined constant CodeIgniter\Log\CI_DEBUG" fatal (thrown deep inside
    # CodeIgniter's own error-reporting path once cache initialization fails)
    # when Redis has no password configured — a known upstream issue in
    # Castopod's official Docker example since 1.6.1:
    # https://code.castopod.org/adaures/castopod/-/issues/408
    command: ["redis-server", "--requirepass", "${CASTOPOD_REDIS_PASSWORD:?CASTOPOD_REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${CASTOPOD_REDIS_PASSWORD:?CASTOPOD_REDIS_PASSWORD is required}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ap_interop_castopod_redis:/data
    networks:
      - ap-interop

  castopod-app:
    image: castopod/castopod:1.9.0@sha256:3ad8970f1decc9c9009502be3efedcf2f5d9fda5c7c9fd85a4408edc84a0bbb9
    depends_on:
      castopod-db:
        condition: service_healthy
      castopod-redis:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: castopod
      MYSQL_USER: castopod
      MYSQL_PASSWORD: ${CASTOPOD_DB_PASSWORD:?CASTOPOD_DB_PASSWORD is required}
      CP_BASEURL: https://castopod.test/
      CP_ANALYTICS_SALT: ${CASTOPOD_ANALYTICS_SALT:?CASTOPOD_ANALYTICS_SALT is required}
      CP_DATABASE_HOSTNAME: castopod-db
      CP_CACHE_HANDLER: redis
      CP_REDIS_HOST: castopod-redis
      CP_REDIS_PASSWORD: ${CASTOPOD_REDIS_PASSWORD:?CASTOPOD_REDIS_PASSWORD is required}
      AP_INTEROP_CASTOPOD_BOOTSTRAP: "1"
      PHP_CLI_SERVER_WORKERS: "8"
      SSL_CERT_FILE: /interop/runtime/certs/rootCA.crt
      CURL_CA_BUNDLE: /interop/runtime/certs/rootCA.crt
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Accept: application/activity+json' http://127.0.0.1:8000/@interop >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - ap_interop_castopod_media:/var/www/castopod/public/media
      - ./castopod/InteropCreatePodcast.php:/var/www/castopod/app/Commands/InteropCreatePodcast.php:ro
      - ./runtime/certs:/interop/runtime/certs:ro
      # PHP's curl/OpenSSL configuration does not reliably inherit the
      # command-line curl trust environment, so explicitly install the
      # fixture CA for Castopod's outbound actor/key fetches.
      - ./fixtures/php/interop-ca.ini:/usr/local/etc/php/conf.d/zz-interop-ca.ini:ro
      # Castopod 1.9.0 assumes keyId always dereferences to a full actor
      # document with nested publicKey.publicKeyPem. ActivityPods serves a
      # standalone CryptographicKey document with top-level publicKeyPem.
      # Keep Castopod's signature verification intact while accepting both
      # legitimate document shapes.
      - ./castopod/HttpSignature.php:/var/www/castopod/modules/Fediverse/HttpSignature.php:ro
      # Define only create_actor_from_uri() before Castopod loads its guarded
      # helper file. This avoids maintaining a 500+ line helper override while
      # allowing ActivityPub actors without optional display `name` and
      # embedded key PEM fields to be materialized safely.
      - ./castopod/actor_compat.php:/interop/castopod/actor_compat.php:ro
      - ./fixtures/php/interop-castopod.ini:/usr/local/etc/php/conf.d/zz-interop-castopod.ini:ro
    networks:
      - ap-interop

volumes:
  ap_interop_castopod_db:
  ap_interop_castopod_redis:
  ap_interop_castopod_media:
