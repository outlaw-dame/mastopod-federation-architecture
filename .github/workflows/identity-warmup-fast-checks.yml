name: Identity Warmup Fast Checks

on:
  pull_request:
    paths:
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupService.ts'
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupService.test.ts'
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupCrashOrdering.test.ts'
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupPassStart.test.ts'
      - 'fedify-sidecar/src/at-adapter/identity/RedisIdentityWarmCursorStore.ts'
      - 'fedify-sidecar/src/at-adapter/identity/RedisIdentityWarmCursorStore.test.ts'
      - '.github/workflows/identity-warmup-fast-checks.yml'
  push:
    branches:
      - master
    paths:
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupService.ts'
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupService.test.ts'
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupCrashOrdering.test.ts'
      - 'fedify-sidecar/src/at-adapter/identity/IdentityWarmupPassStart.test.ts'
      - 'fedify-sidecar/src/at-adapter/identity/RedisIdentityWarmCursorStore.ts'
      - 'fedify-sidecar/src/at-adapter/identity/RedisIdentityWarmCursorStore.test.ts'
      - '.github/workflows/identity-warmup-fast-checks.yml'

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Install Sidecar Dependencies
        run: npm ci --prefix fedify-sidecar

      - name: Typecheck
        working-directory: fedify-sidecar
        run: npm exec -- tsc -p tsconfig.json --noEmit

      - name: Run Identity Warmup Regressions
        working-directory: fedify-sidecar
        run: >-
          npm exec -- vitest run
          src/at-adapter/identity/IdentityWarmupService.test.ts
          src/at-adapter/identity/IdentityWarmupCrashOrdering.test.ts
          src/at-adapter/identity/IdentityWarmupPassStart.test.ts
          src/at-adapter/identity/RedisIdentityWarmCursorStore.test.ts
