name: APDM Phase 6 observation namespace patch

on:
  push:
    branches:
      - apdm/phase-6-retire-raw-routing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip apdm-observation-namespace-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apdm/phase-6-retire-raw-routing
          fetch-depth: 0
      - name: Reserve observation intent namespace
        shell: python
        run: |
          from pathlib import Path

          impl = Path('fedify-sidecar/src/delivery/outbound-webhook.ts')
          text = impl.read_text()
          old = 'const APDM_INTEROP_LEGACY_INTENT_ID = "apdm-interop-legacy-fixture";\n'
          new = old + 'const APDM_OBSERVATION_INTENT_PREFIX = "apdm-observation:";\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('intent constants anchor missing')
              text = text.replace(old, new, 1)

          anchor = '''  if (authoritySource === "interop_legacy") {\n    return undefined;\n  }\n\n  const headerIntentId = normalizeExactIntentId(input.headerIntentId);\n'''
          replacement = '''  if (authoritySource === "interop_legacy") {\n    return undefined;\n  }\n\n  if (markerIntentId.startsWith(APDM_OBSERVATION_INTENT_PREFIX)) {\n    throw new OutboundWebhookValidationError(\n      "OUTBOUND_APDM_INTENT_RESERVED",\n      400,\n      "Delivery Plan intentId must not use the reserved observation intent namespace.",\n    );\n  }\n\n  const headerIntentId = normalizeExactIntentId(input.headerIntentId);\n'''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('identity validation anchor missing')
              text = text.replace(anchor, replacement, 1)
          impl.write_text(text)

          test = Path('fedify-sidecar/src/delivery/tests/OutboundWebhook.test.ts')
          text = test.read_text()
          anchor = '''  it("rejects missing and padded X-APDM-Intent-Id headers", () => {\n'''
          addition = '''  it("reserves the observation intent namespace from Delivery Plan handoffs", () => {\n    const reservedIntentId = "apdm-observation:01TESTEVENT";\n    const result = normalizeAndDedupeOutboundTargets(\n      [\n        {\n          inboxUrl: "https://one.example/inbox",\n          apdmAuthority: { schema: "ap.delivery-plan.v1", intentId: reservedIntentId },\n        },\n      ],\n      webhookConfig(),\n    );\n\n    expect(() =>\n      validateApdmWebhookIdentity({\n        normalizedTargets: result,\n        headerIntentId: reservedIntentId,\n        meta: deliveryPlanMeta(reservedIntentId),\n      }),\n    ).toThrowError(/reserved observation intent namespace/u);\n  });\n\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('test insertion anchor missing')
              text = text.replace(anchor, addition + anchor, 1)
          test.write_text(text)

          Path('.github/workflows/apdm-phase6-observation-namespace-patcher.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(apdm): reserve observation intent namespace [skip apdm-observation-namespace-patcher]"
          git push origin HEAD:apdm/phase-6-retire-raw-routing
