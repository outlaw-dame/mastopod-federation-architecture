name: RedPanda Compression RF3 Benchmark

on:
  pull_request:
    paths:
      - 'fedify-sidecar/scripts/benchmark-redpanda-compression-rf3.ts'
      - 'fedify-sidecar/scripts/analyze-redpanda-compression-rf3.mjs'
      - 'fedify-sidecar/src/streams/kafka-compression.ts'
      - '.github/workflows/redpanda-compression-rf3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redpanda-compression-rf3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  three-broker-rf3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix fedify-sidecar

      - name: Prepare evidence directory
        run: mkdir -p measurements/redpanda-compression-rf3

      - name: Run matched three-broker replication-factor-3 matrix
        working-directory: fedify-sidecar
        env:
          REDPANDA_RF3_IMAGE: redpandadata/redpanda:v26.2.6
          REDPANDA_RF3_REPEATS: '3'
          REDPANDA_RF3_MESSAGES: '4000'
          REDPANDA_RF3_LATENCY_MESSAGES: '300'
          REDPANDA_RF3_BATCH: '100'
          REDPANDA_RF3_OUTPUT: ../measurements/redpanda-compression-rf3/summary.json
        run: npm exec -- tsx scripts/benchmark-redpanda-compression-rf3.ts

      - name: Analyze RF3 promotion decision
        working-directory: fedify-sidecar
        env:
          REDPANDA_RF3_INPUT: ../measurements/redpanda-compression-rf3/summary.json
          REDPANDA_RF3_DECISION_OUTPUT: ../measurements/redpanda-compression-rf3/decision.json
        run: node scripts/analyze-redpanda-compression-rf3.mjs

      - name: Validate measured fallback and unchanged RF3 latency gates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('measurements/redpanda-compression-rf3/summary.json', 'utf8'));
          const decision = JSON.parse(fs.readFileSync('measurements/redpanda-compression-rf3/decision.json', 'utf8'));
          const expected = ['gzip','zstd-1','zstd-2','zstd-3'];
          if (summary.version !== 1 || summary.methodology?.brokers !== 3 ||
              summary.methodology?.replicationFactor !== 3 ||
              summary.methodology?.repeats !== 3) {
            throw new Error('RF3 methodology contract drift');
          }
          if (JSON.stringify(summary.medians.map(x => x.arm)) !== JSON.stringify(expected) ||
              JSON.stringify(decision.comparisons.map(x => x.arm)) !== JSON.stringify(expected)) {
            throw new Error('RF3 candidate/analysis arms drift');
          }
          // The original promotion policy is not relaxed for a broker upgrade.
          const policy = decision.policy;
          if (!policy || policy.singletonP95MaxRatioToGzip !== 1.15 ||
              policy.singletonP99MaxRatioToGzip !== 1.25 ||
              policy.singletonP99MaxAbsoluteIncreaseMs !== 0.5 ||
              policy.totalCpuMaxRatioToGzip !== 0.9 ||
              policy.producerThroughputMinRatioToGzip !== 1.25) {
            throw new Error('RF3 safety/efficiency promotion gate drift');
          }
          const fallback = decision.comparisons.find(x => x.arm === 'gzip');
          if (!fallback?.eligible || !Array.isArray(fallback.reasons) ||
              fallback.reasons.length !== 0) {
            throw new Error('Configured Gzip baseline is invalid under measured RF3 evidence');
          }
          // A single hosted-runner result may suggest an eligible Zstd codec.
          // Keep that recommendation as evidence, not an automatic promotion.
          const selected = decision.comparisons.find(x => x.arm === decision.selectedArm);
          if (!selected?.eligible || selected.reasons.length !== 0) {
            throw new Error('RF3 analyzer selected an ineligible candidate');
          }
          const files = {
            'fedify-sidecar/Dockerfile': /^ENV REDPANDA_COMPRESSION=gzip$/m,
            'fedify-sidecar/.env.v6.example': /^REDPANDA_COMPRESSION=gzip$/m,
            'fedify-sidecar/docker-compose.v6.yml': /^\s+REDPANDA_COMPRESSION: 'gzip'$/m,
          };
          for (const [path,pattern] of Object.entries(files)) {
            if (!pattern.test(fs.readFileSync(path, 'utf8'))) {
              throw new Error('Production Gzip fallback differs from measured RF3 policy: ' + path);
            }
          }
          // Keep every non-Gzip candidate measured and evaluated, including
          // ineligible ones; never alter thresholds to force Zstd promotion.
          for (const arm of decision.comparisons.slice(1)) {
            if (typeof arm.eligible !== 'boolean' || !Array.isArray(arm.reasons) ||
                !Number.isFinite(arm.ratiosToGzip?.singletonP99)) {
              throw new Error('RF3 candidate evidence is incomplete: ' + arm.arm);
            }
          }
          console.log(JSON.stringify({
            selectedArm: decision.selectedArm,
            comparisons: decision.comparisons.map(({arm,eligible,reasons})=>({arm,eligible,reasons})),
            latencyGates: {
              p95Ratio: policy.singletonP95MaxRatioToGzip,
              p99Ratio: policy.singletonP99MaxRatioToGzip,
              p99DeltaMs: policy.singletonP99MaxAbsoluteIncreaseMs
            }
          },null,2));
          NODE

      - name: Capture runner context
        if: always()
        run: |
          {
            echo "runner=$(uname -a)"
            echo "docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
            echo "cpu_count=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          } > measurements/redpanda-compression-rf3/runner.txt

      - name: Upload RF3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redpanda-compression-rf3-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/redpanda-compression-rf3
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup cluster
        if: always()
        run: |
          docker rm -f rf3-redpanda-0 rf3-redpanda-1 rf3-redpanda-2 >/dev/null 2>&1 || true
          docker network rm redpanda-compression-rf3 >/dev/null 2>&1 || true
