name: RedPanda Compression RF3 Benchmark

on:
  pull_request:
    paths:
      - 'fedify-sidecar/scripts/benchmark-redpanda-compression-rf3.ts'
      - 'fedify-sidecar/src/streams/kafka-compression.ts'
      - '.github/workflows/redpanda-compression-rf3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redpanda-compression-rf3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  three-broker-rf3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix fedify-sidecar

      - name: Prepare evidence directory
        run: mkdir -p measurements/redpanda-compression-rf3

      - name: Run matched three-broker replication-factor-3 matrix
        working-directory: fedify-sidecar
        env:
          REDPANDA_RF3_IMAGE: redpandadata/redpanda:v24.1.3
          REDPANDA_RF3_REPEATS: '3'
          REDPANDA_RF3_MESSAGES: '4000'
          REDPANDA_RF3_LATENCY_MESSAGES: '300'
          REDPANDA_RF3_BATCH: '100'
          REDPANDA_RF3_OUTPUT: ../measurements/redpanda-compression-rf3/summary.json
        run: npm exec -- tsx scripts/benchmark-redpanda-compression-rf3.ts

      - name: Capture runner context
        if: always()
        run: |
          {
            echo "runner=$(uname -a)"
            echo "docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
            echo "cpu_count=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          } > measurements/redpanda-compression-rf3/runner.txt

      - name: Upload RF3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redpanda-compression-rf3-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/redpanda-compression-rf3
          if-no-files-found: error
          retention-days: 30

      - name: Validate production Zstd level against RF3 evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('measurements/redpanda-compression-rf3/summary.json', 'utf8'));
          const expected = ['gzip','zstd-1','zstd-2','zstd-3'];
          if (summary.version !== 1 || summary.methodology?.brokers !== 3 || summary.methodology?.replicationFactor !== 3 || summary.methodology?.repeats !== 3) {
            throw new Error('RF3 methodology contract drift');
          }
          if (JSON.stringify(summary.medians.map((x) => x.arm)) !== JSON.stringify(expected)) throw new Error('RF3 arm drift');
          const z2 = summary.comparisons.find((x) => x.arm === 'zstd-2');
          if (!z2) throw new Error('Zstd-2 comparison missing');
          const r = z2.ratiosToGzip;
          if (r.topicDisk > 1.25) throw new Error(`Zstd-2 RF3 disk ${r.topicDisk}x > 1.25x GZIP`);
          if (r.clusterNetwork > 1.25) throw new Error(`Zstd-2 RF3 network ${r.clusterNetwork}x > 1.25x GZIP`);
          if (r.totalCpu > 0.85) throw new Error(`Zstd-2 RF3 total CPU ${r.totalCpu}x > 0.85x GZIP`);
          if (r.singletonP95 > 1.15) throw new Error(`Zstd-2 RF3 p95 ${r.singletonP95}x > 1.15x GZIP`);
          if (r.singletonP99 > 1.20) throw new Error(`Zstd-2 RF3 p99 ${r.singletonP99}x > 1.20x GZIP`);
          if (summary.selectedArm !== 'zstd-2') throw new Error(`RF3 selected ${summary.selectedArm}, expected zstd-2 for current production config`);
          console.log(JSON.stringify({ selectedArm: summary.selectedArm, zstd2: r }, null, 2));
          NODE

      - name: Cleanup cluster
        if: always()
        run: |
          docker rm -f rf3-redpanda-0 rf3-redpanda-1 rf3-redpanda-2 >/dev/null 2>&1 || true
          docker network rm redpanda-compression-rf3 >/dev/null 2>&1 || true
