name: APDM Phase 5 Final Boundary Patch

on:
  push:
    branches: [apdm/phase-5-runtime-cutover]
    paths:
      - '.github/workflows/apdm-phase5-final-boundary-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apdm/phase-5-runtime-cutover
      - name: Wire post-DNS deadline assertions
        shell: python
        run: |
          from pathlib import Path

          worker = Path('fedify-sidecar/src/delivery/outbound-worker.ts')
          text = worker.read_text()
          old = '''      const response = await secureActivityPubRequest(job.targetInbox, {
                  method: "POST",
                  headers,
                  body: job.activity,
                  bodyTimeout: this.config.requestTimeoutMs,
                  headersTimeout: this.config.requestTimeoutMs,
                  maxRedirections: 0,
                });'''.replace('                ', '')
          new = '''      const response = await secureActivityPubRequest(job.targetInbox, {
                  method: "POST",
                  headers,
                  body: job.activity,
                  bodyTimeout: this.config.requestTimeoutMs,
                  headersTimeout: this.config.requestTimeoutMs,
                  maxRedirections: 0,
                }, () => this.assertExternalPostAllowed(job));'''.replace('                ', '')
          if old not in text:
              raise SystemExit('worker secure request passage not found')
          worker.write_text(text.replace(old, new, 1))

          adapter = Path('fedify-sidecar/src/federation/FedifyFederationAdapter.ts')
          text = adapter.read_text()
          needle = '''        headersTimeout: input.requestTimeoutMs || this.outboundRuntimeConfig.requestTimeoutMs,
                });'''.replace('                ', '')
          replacement = '''        headersTimeout: input.requestTimeoutMs || this.outboundRuntimeConfig.requestTimeoutMs,
                }, input.assertExternalPostAllowed);'''.replace('                ', '')
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'expected 2 adapter secure request endings, found {count}')
          adapter.write_text(text.replace(needle, replacement))
      - name: Commit source patch and remove one-shot workflow
        run: |
          rm .github/workflows/apdm-phase5-final-boundary-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fedify-sidecar/src/delivery/outbound-worker.ts fedify-sidecar/src/federation/FedifyFederationAdapter.ts .github/workflows/apdm-phase5-final-boundary-patch.yml
          git commit -m 'fix(apdm): recheck residence after DNS validation'
          git push origin HEAD:apdm/phase-5-runtime-cutover
