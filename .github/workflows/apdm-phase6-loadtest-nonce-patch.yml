name: APDM Phase 6 loadtest nonce patch

on:
  push:
    branches:
      - apdm/phase-6-retire-raw-routing
    paths:
      - scripts/apdm-phase6-loadtest-nonce-patch.py
      - .github/workflows/apdm-phase6-loadtest-nonce-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip apdm-loadtest-nonce-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded relay benchmark nonce patch
        run: python scripts/apdm-phase6-loadtest-nonce-patch.py
      - name: Commit production/test changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(apdm): make relay loadtest identities run-unique [skip apdm-loadtest-nonce-patcher]'
          git push
