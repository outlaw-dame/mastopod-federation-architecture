name: APDM Phase 6 guarded patch

on:
  push:
    branches:
      - apdm/phase-6-retire-raw-routing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip apdm-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: apdm/phase-6-retire-raw-routing
          fetch-depth: 0

      - name: Apply guarded index patch
        run: python fedify-sidecar/scripts/apdm-phase6-patch-index.py

      - name: Remove temporary patcher
        run: |
          rm -f fedify-sidecar/scripts/apdm-phase6-patch-index.py
          rm -f .github/workflows/apdm-phase6-patch.yml

      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(apdm): enforce Phase 6 webhook authority [skip apdm-patcher]"
          git push origin HEAD:apdm/phase-6-retire-raw-routing
