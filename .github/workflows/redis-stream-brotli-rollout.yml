name: Redis Stream Brotli Rollout Proof

on:
  pull_request:
    paths:
      - 'fedify-sidecar/src/queue/redis-stream-payload-codec.ts'
      - 'fedify-sidecar/src/queue/sidecar-redis-queue-core.ts'
      - 'fedify-sidecar/src/queue/tests/RedisStreamsQueueCompression.test.ts'
      - 'fedify-sidecar/scripts/proof-redis-stream-brotli-rollout.ts'
      - 'fedify-sidecar/interop/ap/docker-compose.redis-compression.yml'
      - 'fedify-sidecar/interop/ap/scripts/run-gotosocial-proof.sh'
      - 'fedify-sidecar/interop/ap/scripts/run-mastodon-proof.sh'
      - '.github/workflows/redis-stream-brotli-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollout-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - run: npm ci --prefix fedify-sidecar

      - name: Run focused compression regression tests
        working-directory: fedify-sidecar
        run: npx vitest run src/queue/tests/RedisStreamsQueueCompression.test.ts src/queue/tests/RedisStreamPayloadCodec.test.ts

      - name: Prove staged enablement, crash recovery, and writer rollback
        working-directory: fedify-sidecar
        env:
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_BROTLI_ROLLOUT_PROOF_OUTPUT: ../measurements/redis-stream-brotli-rollout/evidence.json
        run: npx tsx scripts/proof-redis-stream-brotli-rollout.ts

      - name: Validate rollout evidence contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('measurements/redis-stream-brotli-rollout/evidence.json', 'utf8'));
          if (evidence.schema !== 'apdm-redis-stream-brotli-rollout.v1') throw new Error('unexpected evidence schema');
          if (evidence.stages.decodeCapableWriteDisabled.persistedEncoding !== 'plaintext') throw new Error('stage 1 did not remain plaintext');
          if (!evidence.stages.decodeCapableWriteDisabled.consumedByEnabledReader) throw new Error('enabled reader did not consume retained plaintext');
          if (evidence.stages.compressionEnabled.persistedEncoding !== 'apq1:br') throw new Error('stage 2 did not persist Brotli envelope');
          if (!evidence.stages.compressionEnabled.inMemoryActivityUnchanged) throw new Error('stage 2 changed the in-memory Activity');
          if (!evidence.stages.writerRollback.reclaimedCompressedPendingEntry) throw new Error('rollback did not reclaim compressed pending work');
          if (!evidence.stages.writerRollback.compressedPayloadDecodedUnchanged) throw new Error('rollback did not decode compressed work');
          if (!evidence.stages.writerRollback.newWritesReturnedToPlaintext) throw new Error('rollback writer did not return to plaintext');
          if (evidence.stages.writerRollback.finalPendingCount !== 0) throw new Error('rollout proof left pending work');
          for (const [name, value] of Object.entries(evidence.invariants)) {
            if (value !== true) throw new Error(`rollout invariant failed: ${name}`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: redis-stream-brotli-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/redis-stream-brotli-rollout/
          if-no-files-found: error
          retention-days: 30

  compression-enabled-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_DOCKER_CLI_BUILD: '1'
      DOCKER_BUILDKIT: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - run: npm ci --prefix fedify-sidecar

      - name: Run GoToSocial federation with compressed Redis Stream writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p measurements/redis-stream-brotli-interop
          override="$GITHUB_WORKSPACE/fedify-sidecar/interop/ap/docker-compose.redis-compression.yml"
          AP_INTEROP_COMPOSE_OVERRIDE="$override" \
          AP_INTEROP_GOTOSOCIAL_RESET_STATE=1 \
            fedify-sidecar/interop/ap/scripts/run-gotosocial-proof.sh \
            2>&1 | tee measurements/redis-stream-brotli-interop/gotosocial.log

          docker compose \
            -f fedify-sidecar/interop/ap/docker-compose.ap-interop.yml \
            -f "$override" \
            exec -T redis redis-cli --raw XRANGE ap:queue:outbound:v1 - + \
            > measurements/redis-stream-brotli-interop/gotosocial-outbound-stream.txt

          grep -q '^apq1:br:' measurements/redis-stream-brotli-interop/gotosocial-outbound-stream.txt

      - name: Run Mastodon federation with compressed Redis Stream writes
        shell: bash
        run: |
          set -euo pipefail
          override="$GITHUB_WORKSPACE/fedify-sidecar/interop/ap/docker-compose.redis-compression.yml"
          AP_INTEROP_COMPOSE_OVERRIDE="$override" \
            fedify-sidecar/interop/ap/scripts/run-mastodon-proof.sh \
            2>&1 | tee measurements/redis-stream-brotli-interop/mastodon.log

          docker compose \
            -f fedify-sidecar/interop/ap/docker-compose.ap-interop.yml \
            -f "$override" \
            exec -T redis redis-cli --raw XRANGE ap:queue:outbound:v1 - + \
            > measurements/redis-stream-brotli-interop/mastodon-outbound-stream.txt

          grep -q '^apq1:br:' measurements/redis-stream-brotli-interop/mastodon-outbound-stream.txt

      - name: Record compression-enabled interop evidence
        if: success()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'measurements/redis-stream-brotli-interop';
          const summarize = target => {
            const raw = fs.readFileSync(path.join(dir, `${target}-outbound-stream.txt`), 'utf8');
            const envelopes = raw.split(/\r?\n/u).filter(line => line.startsWith('apq1:br:'));
            if (envelopes.length === 0) throw new Error(`${target} did not persist a compressed outbound Activity`);
            return { target, compressedEnvelopeCount: envelopes.length };
          };
          const evidence = {
            schema: 'apdm-redis-stream-brotli-interop.v1',
            measuredAt: new Date().toISOString(),
            writerEnabled: true,
            minimumBytes: 1,
            targets: [summarize('gotosocial'), summarize('mastodon')],
            interpretation: 'Each target completed the existing ActivityPub interoperability proof while the live sidecar persisted at least one versioned Brotli outbound Stream payload.',
          };
          fs.writeFileSync(path.join(dir, 'evidence.json'), `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Collect compose logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p measurements/redis-stream-brotli-interop
          override="$GITHUB_WORKSPACE/fedify-sidecar/interop/ap/docker-compose.redis-compression.yml"
          docker compose \
            -f fedify-sidecar/interop/ap/docker-compose.ap-interop.yml \
            -f "$override" \
            ps > measurements/redis-stream-brotli-interop/compose-ps.txt || true
          docker compose \
            -f fedify-sidecar/interop/ap/docker-compose.ap-interop.yml \
            -f "$override" \
            logs --no-color > measurements/redis-stream-brotli-interop/compose.log || true

      - name: Upload compression interop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-stream-brotli-interop-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/redis-stream-brotli-interop/
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down AP interop stack
        if: always()
        shell: bash
        run: |
          override="$GITHUB_WORKSPACE/fedify-sidecar/interop/ap/docker-compose.redis-compression.yml"
          docker compose \
            -f fedify-sidecar/interop/ap/docker-compose.ap-interop.yml \
            -f "$override" \
            --profile mastodon --profile akkoma --profile proof down -v --remove-orphans || true
