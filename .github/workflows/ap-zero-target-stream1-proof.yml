name: AP Zero-Target Stream1 Proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/ap-zero-target-stream1-proof.yml'
      - 'fedify-sidecar/scripts/proof-zero-target-stream1.ts'
      - 'fedify-sidecar/src/delivery/**'
      - 'fedify-sidecar/src/queue/**'
      - 'fedify-sidecar/src/streams/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ap-zero-target-stream1-proof.yml'
      - 'fedify-sidecar/scripts/proof-zero-target-stream1.ts'
      - 'fedify-sidecar/src/delivery/**'
      - 'fedify-sidecar/src/queue/**'
      - 'fedify-sidecar/src/streams/**'

permissions:
  contents: read

concurrency:
  group: ap-zero-target-stream1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-zero-target-proof:
    name: real Redis to RedPanda zero-target observation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Install sidecar dependencies
        run: npm ci --prefix fedify-sidecar

      - name: Prepare ephemeral credentials and evidence directory
        run: |
          set -euo pipefail
          mkdir -p measurements/ap-zero-target-stream1
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "SIDECAR_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Start real Redis
        run: |
          set -euo pipefail
          docker rm -f ap-zero-target-redis >/dev/null 2>&1 || true
          docker run -d --name ap-zero-target-redis -p 6379:6379 redis:7-alpine
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec ap-zero-target-redis redis-cli PING | grep -q PONG; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            docker logs ap-zero-target-redis
            exit 1
          fi

      - name: Start real RedPanda
        run: |
          set -euo pipefail
          docker rm -f ap-zero-target-redpanda >/dev/null 2>&1 || true
          docker run -d --name ap-zero-target-redpanda \
            -p 19092:19092 -p 19644:9644 \
            redpandadata/redpanda:v24.1.3 \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 768M \
              --reserve-memory 0M \
              --node-id 0 \
              --check=false \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://127.0.0.1:9092,external://127.0.0.1:19092
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec ap-zero-target-redpanda rpk cluster health --exit-when-healthy >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            docker logs ap-zero-target-redpanda
            exit 1
          fi
          for topic in \
            ap.stream1.local-public.v1 \
            ap.stream2.remote-public.v1 \
            ap.firehose.v1 \
            ap.tombstones.v1; do
            docker exec ap-zero-target-redpanda rpk topic create "${topic}"
          done

      - name: Start sidecar observation path
        working-directory: fedify-sidecar
        run: |
          set -euo pipefail
          NODE_ENV=development \
          PORT=8080 \
          HOST=127.0.0.1 \
          DOMAIN=local.example \
          SIDECAR_STARTUP_MODE=blocking \
          REDIS_URL=redis://127.0.0.1:6379 \
          APDM_COMPLETION_MARKER_V2_CUTOVER=fresh \
          REDPANDA_BROKERS=127.0.0.1:19092 \
          REDPANDA_ENFORCE_TOPIC_GOVERNANCE=false \
          STREAM1_TOPIC=ap.stream1.local-public.v1 \
          STREAM2_TOPIC=ap.stream2.remote-public.v1 \
          FIREHOSE_TOPIC=ap.firehose.v1 \
          TOMBSTONE_TOPIC=ap.tombstones.v1 \
          SIDECAR_TOKEN="$SIDECAR_TOKEN" \
          ENABLE_OUTBOUND_WORKER=false \
          ENABLE_OUTBOX_INTENT_WORKER=true \
          ENABLE_INBOUND_WORKER=false \
          ENABLE_ORIGIN_RECONCILIATION=false \
          ENABLE_FEDIFY_RUNTIME_INTEGRATION=false \
          ENABLE_OPENSEARCH_INDEXER=false \
          ENABLE_XRPC_SERVER=false \
          ENABLE_MEDIA_ASSET_SYNC=false \
          ENABLE_ACCOUNT_PROVISIONING=false \
          ENABLE_ENTRYWAY=false \
          ENABLE_FOLLOWERS_SYNC=false \
          ENABLE_MRF_ADMIN_API=false \
          ENABLE_MODERATION_BRIDGE_API=false \
          ENABLE_CANONICAL_EVENT_LOG=false \
          ENABLE_CANONICAL_NOTIFICATIONS=false \
          ENABLE_AT_JETSTREAM=false \
          ENABLE_AT_EXTERNAL_FIREHOSE=false \
          OUTBOUND_STREAM_KEY=ap:queue:outbound:v1 \
          OUTBOX_INTENT_STREAM_KEY=ap:queue:outbox-intent:v1 \
            npm run server:dev > ../measurements/ap-zero-target-stream1/sidecar.log 2>&1 &
          echo "$!" > ../measurements/ap-zero-target-stream1/sidecar.pid
          pid="$(cat ../measurements/ap-zero-target-stream1/sidecar.pid)"
          ready=false
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              cat ../measurements/ap-zero-target-stream1/sidecar.log
              exit 1
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            cat ../measurements/ap-zero-target-stream1/sidecar.log
            exit 1
          fi

      - name: Prove zero-target durable observation
        working-directory: fedify-sidecar
        env:
          REDIS_URL: redis://127.0.0.1:6379
          REDPANDA_BROKERS: 127.0.0.1:19092
          STREAM1_TOPIC: ap.stream1.local-public.v1
          FIREHOSE_TOPIC: ap.firehose.v1
          OUTBOUND_STREAM_KEY: ap:queue:outbound:v1
          ZERO_TARGET_STREAM1_PROOF_OUTPUT: ../measurements/ap-zero-target-stream1/proof.json
        run: npm exec -- tsx scripts/proof-zero-target-stream1.ts

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap-zero-target-stream1-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            measurements/ap-zero-target-stream1/proof.json
            measurements/ap-zero-target-stream1/sidecar.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop fixture
        if: always()
        run: |
          if [[ -f measurements/ap-zero-target-stream1/sidecar.pid ]]; then
            kill "$(cat measurements/ap-zero-target-stream1/sidecar.pid)" >/dev/null 2>&1 || true
          fi
          docker rm -f ap-zero-target-redis ap-zero-target-redpanda >/dev/null 2>&1 || true
