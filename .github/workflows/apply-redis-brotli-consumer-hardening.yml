name: Apply Redis Brotli Consumer Hardening

on:
  push:
    branches:
      - agent/redis-stream-brotli-compression-prototype
    paths:
      - '.github/workflows/apply-redis-brotli-consumer-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redis-stream-brotli-compression-prototype
          fetch-depth: 0

      - name: Apply deterministic hardening patch
        run: python3 scripts/apply-redis-brotli-consumer-hardening.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-redis-brotli-consumer-hardening.py
          rm .github/workflows/apply-redis-brotli-consumer-hardening.yml

      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fedify-sidecar/src/queue/sidecar-redis-queue-core.ts scripts/apply-redis-brotli-consumer-hardening.py .github/workflows/apply-redis-brotli-consumer-hardening.yml
          git commit -m 'Harden compressed Redis Stream consumer recovery'
          git push origin HEAD:agent/redis-stream-brotli-compression-prototype
