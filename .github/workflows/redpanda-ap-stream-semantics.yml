name: RedPanda AP stream semantics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/adsp-p0-activitypods-origin-runtime
      - agent/redpanda-ap-stream-authority-hardening
    paths:
      - '.github/workflows/redpanda-ap-stream-semantics.yml'
      - 'fedify-sidecar/src/streams/**'
      - 'fedify-sidecar/src/delivery/inbound-worker.ts'
      - 'fedify-sidecar/src/delivery/tests/StreamOriginAuthority.test.ts'
      - 'fedify-sidecar/scripts/proof-ap-redpanda-stream-semantics.ts'
      - 'fedify-sidecar/package.json'
      - 'fedify-sidecar/package-lock.json'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/redpanda-ap-stream-semantics.yml'
      - 'fedify-sidecar/src/streams/**'
      - 'fedify-sidecar/src/delivery/inbound-worker.ts'
      - 'fedify-sidecar/src/delivery/tests/StreamOriginAuthority.test.ts'
      - 'fedify-sidecar/scripts/proof-ap-redpanda-stream-semantics.ts'
      - 'fedify-sidecar/package.json'
      - 'fedify-sidecar/package-lock.json'

permissions:
  contents: read

concurrency:
  group: redpanda-ap-stream-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redpanda-ap-stream-semantics:
    name: prove Stream1 Stream2 and AP firehose on real RedPanda with Zstd
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix fedify-sidecar

      - name: Start isolated RedPanda
        run: |
          set -euo pipefail
          mkdir -p measurements/redpanda-ap-streams
          docker rm -f ap-stream-proof-redpanda >/dev/null 2>&1 || true
          docker run -d --name ap-stream-proof-redpanda \
            -p 19092:19092 -p 19644:9644 \
            redpandadata/redpanda:v24.1.3 \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 768M \
              --reserve-memory 0M \
              --node-id 0 \
              --check=false \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://127.0.0.1:9092,external://127.0.0.1:19092

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec ap-stream-proof-redpanda rpk cluster health --exit-when-healthy >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            docker logs ap-stream-proof-redpanda
            exit 1
          fi

          topics=(
            ap.stream1.local-public.v1
            ap.stream2.remote-public.v1
            ap.firehose.v1
            ap.tombstones.v1
          )
          for topic in "${topics[@]}"; do
            docker exec ap-stream-proof-redpanda rpk topic create "${topic}" --config compression.type=producer
          done
          docker exec ap-stream-proof-redpanda rpk topic list > measurements/redpanda-ap-streams/topics-before.txt

      - name: Run routing producer and compression contracts
        working-directory: fedify-sidecar
        env:
          REDPANDA_COMPRESSION: zstd
          REDPANDA_ZSTD_LEVEL: '2'
        run: |
          npm exec -- vitest run \
            src/streams/tests/KafkaCompression.test.ts \
            src/streams/tests/RedPandaActivityPubStreams.test.ts \
            src/delivery/tests/StreamOriginAuthority.test.ts

      - name: Prove real broker stream membership with Zstd producer batches
        working-directory: fedify-sidecar
        env:
          REDPANDA_BROKERS: 127.0.0.1:19092
          REDPANDA_COMPRESSION: zstd
          REDPANDA_ZSTD_LEVEL: '2'
          STREAM1_TOPIC: ap.stream1.local-public.v1
          STREAM2_TOPIC: ap.stream2.remote-public.v1
          FIREHOSE_TOPIC: ap.firehose.v1
          TOMBSTONE_TOPIC: ap.tombstones.v1
          AP_REDPANDA_STREAM_PROOF_OUTPUT: ../measurements/redpanda-ap-streams/proof.json
        run: npm exec -- tsx scripts/proof-ap-redpanda-stream-semantics.ts

      - name: Capture broker evidence
        if: always()
        run: |
          set +e
          mkdir -p measurements/redpanda-ap-streams
          topics=(
            ap.stream1.local-public.v1
            ap.stream2.remote-public.v1
            ap.firehose.v1
            ap.tombstones.v1
          )
          for topic in "${topics[@]}"; do
            {
              echo "=== ${topic} ==="
              docker exec ap-stream-proof-redpanda rpk topic describe "${topic}" -c
            } >> measurements/redpanda-ap-streams/topics-after.txt 2>&1
          done
          docker logs ap-stream-proof-redpanda > measurements/redpanda-ap-streams/redpanda.log 2>&1

      - name: Upload RedPanda AP stream proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redpanda-ap-stream-semantics-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/redpanda-ap-streams
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated RedPanda
        if: always()
        run: docker rm -f ap-stream-proof-redpanda >/dev/null 2>&1 || true