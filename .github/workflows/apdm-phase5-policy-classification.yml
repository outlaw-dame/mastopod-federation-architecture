name: APDM Phase 5 Policy Classification Patch

on:
  push:
    branches:
      - apdm/phase-5-runtime-cutover
    paths:
      - scripts/apply-apdm-phase5-policy-classification.mjs
      - .github/workflows/apdm-phase5-policy-classification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apdm/phase-5-runtime-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply unsafe-target classification wiring
        run: node scripts/apply-apdm-phase5-policy-classification.mjs
      - name: Remove one-shot patch machinery
        run: git rm scripts/apply-apdm-phase5-policy-classification.mjs .github/workflows/apdm-phase5-policy-classification.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(apdm): make unsafe egress targets permanent failures"
          git push origin HEAD:apdm/phase-5-runtime-cutover
