name: RedPanda Compression Benchmark V2

on:
  pull_request:
    paths:
      - 'fedify-sidecar/scripts/benchmark-redpanda-compression-v2.ts'
      - 'fedify-sidecar/src/streams/kafka-compression.ts'
      - '.github/workflows/redpanda-compression-benchmark-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redpanda-compression-benchmark-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repeated-matched-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix fedify-sidecar

      - name: Prepare evidence directory
        run: mkdir -p measurements/redpanda-compression-v2

      - name: Run three-repeat matched real Redpanda matrix
        working-directory: fedify-sidecar
        env:
          REDPANDA_BENCH_IMAGE: redpandadata/redpanda:v24.1.3
          REDPANDA_BENCH_REPEATS: '3'
          REDPANDA_BENCH_SAMPLES: '5'
          REDPANDA_BENCH_LATENCY_SAMPLES: '5'
          REDPANDA_BENCH_PARTITIONS: '6'
          REDPANDA_BENCH_BATCH_SIZE: '100'
          REDPANDA_BENCH_SETTLE_MS: '900'
          REDPANDA_COMPRESSION_BENCH_OUTPUT: ../measurements/redpanda-compression-v2/summary.json
        run: npm exec -- tsx scripts/benchmark-redpanda-compression-v2.ts

      - name: Validate evidence contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('measurements/redpanda-compression-v2/summary.json', 'utf8'));
          const expected = ['none','gzip','zstd--1','zstd-1','zstd-2','zstd-3','zstd-4','zstd-6'];
          if (summary.version !== 2) throw new Error(`Unexpected summary version ${summary.version}`);
          if (summary.methodology?.repeats !== 3 || !summary.methodology?.isolatedWarmupTopic || !summary.methodology?.freshBrokerPerArmPerRepeat) {
            throw new Error('Benchmark methodology contract is incomplete');
          }
          if (JSON.stringify(summary.arms.map((x) => x.arm)) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected arms ${JSON.stringify(summary.arms.map((x) => x.arm))}`);
          }
          if (summary.raw.length !== expected.length * 3 * 6) {
            throw new Error(`Expected ${expected.length * 3 * 6} raw measurements, got ${summary.raw.length}`);
          }
          for (const arm of summary.arms) {
            if (arm.scenarios.length !== 6) throw new Error(`${arm.arm}: expected six scenario medians`);
            for (const scenario of arm.scenarios) {
              if (scenario.repeats !== 3) throw new Error(`${arm.arm}/${scenario.scenario.id}: repeat count drift`);
            }
          }
          if (!Array.isArray(summary.paretoFrontier) || summary.paretoFrontier.length === 0) {
            throw new Error('Pareto frontier is empty');
          }
          console.log(JSON.stringify({ paretoFrontier: summary.paretoFrontier, comparisons: summary.comparisons }, null, 2));
          NODE

      - name: Capture runner context
        run: |
          {
            echo "runner=$(uname -a)"
            echo "docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
            echo "cpu_count=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          } > measurements/redpanda-compression-v2/runner.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: redpanda-compression-benchmark-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/redpanda-compression-v2
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup broker
        if: always()
        run: docker rm -f redpanda-compression-bench-v2 >/dev/null 2>&1 || true
