name: APDM Phase 6 relay benchmark patch

on:
  push:
    branches:
      - apdm/phase-6-retire-raw-routing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip apdm-relay-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apdm/phase-6-retire-raw-routing
          fetch-depth: 0
      - run: python fedify-sidecar/scripts/apdm-phase6-patch-relay-loadtest.py
      - run: |
          rm -f fedify-sidecar/scripts/apdm-phase6-patch-relay-loadtest.py
          rm -f .github/workflows/apdm-phase6-patch-relay.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(apdm): bind relay benchmark handoff identity [skip apdm-relay-patcher]"
          git push origin HEAD:apdm/phase-6-retire-raw-routing
