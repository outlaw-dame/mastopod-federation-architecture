name: ActivityPub Real Multi-Implementation Federation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/activitypub-real-multi-implementation-federation.yml'
      - 'fedify-sidecar/interop/ap/**'
      - 'fedify-sidecar/src/delivery/**'
      - 'fedify-sidecar/src/queue/**'
      - 'fedify-sidecar/src/signing/**'
      - 'fedify-sidecar/src/federation/**'

permissions:
  contents: read

concurrency:
  group: activitypub-real-multi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-federation:
    name: ${{ matrix.target }} native + sidecar federation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mastodon
            target_host: mastodon
            activitypods_host: activitypods
            compose_overlay: ''
            actor_uri: https://mastodon/users/interop
            remote_version: Mastodon v4.5.8
          - target: gotosocial
            target_host: gotosocial
            activitypods_host: activitypods
            compose_overlay: ''
            actor_uri: https://gotosocial/users/interop
            remote_version: GoToSocial 0.21.3
          - target: akkoma
            target_host: akkoma
            activitypods_host: activitypods
            compose_overlay: ''
            actor_uri: https://akkoma/users/interop
            remote_version: Akkoma v3.18.1@792385f4ac1e258c21a3a900342c4ded14db1727
          - target: pixelfed
            target_host: pixelfed.test
            activitypods_host: activitypods.test
            compose_overlay: fedify-sidecar/interop/ap/docker-compose.pixelfed.yml
            actor_uri: https://pixelfed.test/users/interop
            remote_version: Pixelfed v0.12.7@e33026a9e5334d2c124a7321f8b15d4329b8961f
          - target: misskey
            target_host: misskey.test
            activitypods_host: activitypods.test
            compose_overlay: fedify-sidecar/interop/ap/docker-compose.misskey.yml
            actor_uri: https://misskey.test/@interop
            remote_version: Misskey 2026.7.0@sha256:2fd5c68fb02a354979caeb37560e0dea50d8a84b78a7b0d769e4e9cf426a4b68
          - target: friendica
            target_host: friendica.test
            activitypods_host: activitypods.test
            compose_overlay: fedify-sidecar/interop/ap/docker-compose.friendica.yml
            actor_uri: https://friendica.test/profile/interop
            remote_version: Friendica 2026.05@sha256:e496eeb34fc2c9eb24eae94d2835c39e9a715966f625db769b188427b61ece6d
          - target: castopod
            target_host: castopod.test
            activitypods_host: activitypods.test
            compose_overlay: fedify-sidecar/interop/ap/docker-compose.castopod.yml
            actor_uri: https://castopod.test/@interop
            remote_version: Castopod 1.9.0@sha256:3ad8970f1decc9c9009502be3efedcf2f5d9fda5c7c9fd85a4408edc84a0bbb9
    env:
      FEDERATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACTIVITYPODS_SHA: 'b7663393486eb08e17adf927ce94d98a03b2a992'
      PIXELFED_SHA: 'e33026a9e5334d2c124a7321f8b15d4329b8961f'
      PIXELFED_IMAGE: ap-pixelfed:e33026a9e5334d2c124a7321f8b15d4329b8961f
      COMPOSE_FILE: fedify-sidecar/interop/ap/docker-compose.ap-interop.yml
      REAL_OVERLAY: fedify-sidecar/interop/ap/docker-compose.real-activitypods.yml
      PIXELFED_OVERLAY: fedify-sidecar/interop/ap/docker-compose.pixelfed.yml
      MISSKEY_OVERLAY: fedify-sidecar/interop/ap/docker-compose.misskey.yml
      FRIENDICA_OVERLAY: fedify-sidecar/interop/ap/docker-compose.friendica.yml
      CASTOPOD_OVERLAY: fedify-sidecar/interop/ap/docker-compose.castopod.yml
      BONFIRE_OVERLAY: fedify-sidecar/interop/ap/docker-compose.bonfire.yml
      TARGET: ${{ matrix.target }}
      TARGET_HOST: ${{ matrix.target_host }}
      ACTIVITYPODS_HOST: ${{ matrix.activitypods_host }}
      TARGET_COMPOSE_OVERLAY: ${{ matrix.compose_overlay }}
      TARGET_ACTOR_URI: ${{ matrix.actor_uri }}
      TARGET_USERNAME: interop
      EVIDENCE_DIR: measurements/ap-real-multi/${{ matrix.target }}

    steps:
      - name: Checkout federation architecture
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEDERATION_SHA }}
          persist-credentials: false

      - name: Checkout exact ActivityPods signing candidate
        uses: actions/checkout@v4
        with:
          repository: outlaw-dame/activity-pods
          ref: ${{ env.ACTIVITYPODS_SHA }}
          path: activitypods
          persist-credentials: false

      - name: Checkout exact Pixelfed fixture source
        if: matrix.target == 'pixelfed'
        uses: actions/checkout@v4
        with:
          repository: pixelfed/pixelfed
          ref: ${{ env.PIXELFED_SHA }}
          path: pixelfed
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fedify-sidecar/package-lock.json

      - name: Prepare ephemeral credentials and evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          activitypods_token="$(openssl rand -hex 32)"
          sidecar_token="$(openssl rand -hex 32)"
          password_verify_token="$(openssl rand -hex 32)"
          pixelfed_db_password="$(openssl rand -hex 32)"
          pixelfed_db_root_password="$(openssl rand -hex 32)"
          pixelfed_app_key="base64:$(openssl rand -base64 32)"
          misskey_db_password="$(openssl rand -hex 32)"
          misskey_setup_password="$(openssl rand -hex 32)"
          misskey_user_password="$(openssl rand -hex 32)"
          friendica_db_password="$(openssl rand -hex 32)"
          friendica_db_root_password="$(openssl rand -hex 32)"
          castopod_db_password="$(openssl rand -hex 32)"
          castopod_db_root_password="$(openssl rand -hex 32)"
          castopod_analytics_salt="$(openssl rand -hex 32)"
          castopod_admin_password="$(openssl rand -hex 32)"
          bonfire_db_password="$(openssl rand -hex 32)"
          bonfire_secret_key_base="$(openssl rand -hex 64)"
          bonfire_signing_salt="$(openssl rand -hex 32)"
          bonfire_encryption_salt="$(openssl rand -hex 32)"
          bonfire_release_cookie="$(openssl rand -hex 32)"
          for value in "${activitypods_token}" "${sidecar_token}" "${password_verify_token}" "${pixelfed_db_password}" "${pixelfed_db_root_password}" "${pixelfed_app_key}" "${misskey_db_password}" "${misskey_setup_password}" "${misskey_user_password}" "${friendica_db_password}" "${friendica_db_root_password}" "${castopod_db_password}" "${castopod_db_root_password}" "${castopod_analytics_salt}" "${castopod_admin_password}" "${bonfire_db_password}" "${bonfire_secret_key_base}" "${bonfire_signing_salt}" "${bonfire_encryption_salt}" "${bonfire_release_cookie}"; do echo "::add-mask::${value}"; done
          {
            echo "ACTIVITYPODS_TOKEN=${activitypods_token}"
            echo "SIDECAR_TOKEN=${sidecar_token}"
            echo "ATPROTO_PASSWORD_VERIFY_TOKEN=${password_verify_token}"
            echo "PIXELFED_DB_PASSWORD=${pixelfed_db_password}"
            echo "PIXELFED_DB_ROOT_PASSWORD=${pixelfed_db_root_password}"
            echo "PIXELFED_APP_KEY=${pixelfed_app_key}"
            echo "MISSKEY_DB_PASSWORD=${misskey_db_password}"
            echo "MISSKEY_SETUP_PASSWORD=${misskey_setup_password}"
            echo "MISSKEY_USER_PASSWORD=${misskey_user_password}"
            echo "FRIENDICA_DB_PASSWORD=${friendica_db_password}"
            echo "FRIENDICA_DB_ROOT_PASSWORD=${friendica_db_root_password}"
            echo "CASTOPOD_DB_PASSWORD=${castopod_db_password}"
            echo "CASTOPOD_DB_ROOT_PASSWORD=${castopod_db_root_password}"
            echo "CASTOPOD_ANALYTICS_SALT=${castopod_analytics_salt}"
            echo "CASTOPOD_ADMIN_PASSWORD=${castopod_admin_password}"
            echo "BONFIRE_DB_PASSWORD=${bonfire_db_password}"
            echo "BONFIRE_SECRET_KEY_BASE=${bonfire_secret_key_base}"
            echo "BONFIRE_SIGNING_SALT=${bonfire_signing_salt}"
            echo "BONFIRE_ENCRYPTION_SALT=${bonfire_encryption_salt}"
            echo "BONFIRE_RELEASE_COOKIE=${bonfire_release_cookie}"
          } >> "$GITHUB_ENV"
          printf '{"schema":"activitypods.activitypub.real-multi-run.v1","target":"%s","activityPodsSha":"%s","federationSha":"%s"}\n' \
            "${TARGET}" "${ACTIVITYPODS_SHA}" "${FEDERATION_SHA}" > "${EVIDENCE_DIR}/run-started.json"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix fedify-sidecar
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          sed -i 's#ssh://git@github.com/#https://github.com/#g; s#git+ssh://git@github.com/#git+https://github.com/#g; s#git@github.com:#https://github.com/#g' activitypods/pod-provider/backend/yarn.lock
          yarn --cwd activitypods/pod-provider/backend install --frozen-lockfile

      - name: Generate TLS and resolve canonical local hosts
        shell: bash
        run: |
          set -euo pipefail
          fedify-sidecar/interop/ap/scripts/generate-certs.sh
          echo "NODE_EXTRA_CA_CERTS=${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/runtime/certs/rootCA.crt" >> "$GITHUB_ENV"

      - name: Start ActivityPods data services
        working-directory: activitypods/pod-provider
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test data/redis_test
          mkdir -p data/fuseki_test data/redis_test
          docker compose -f docker-compose-test.yml up -d fuseki_test redis mailcatcher
          FUSEKI_URL=http://localhost:3040 AUTH_DATASET=settings WAIT_SECONDS=90 ./scripts/fuseki-bootstrap.sh
          docker compose -f docker-compose-test.yml exec -T redis redis-cli PING

      - name: Start local Redpanda event log
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f "ap-real-redpanda-${TARGET}" >/dev/null 2>&1 || true
          docker run -d --name "ap-real-redpanda-${TARGET}" -p 19092:19092 redpandadata/redpanda:v24.1.3 \
            redpanda start --overprovisioned --smp 1 --memory 768M --reserve-memory 0M --node-id 0 --check=false \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://127.0.0.1:9092,external://127.0.0.1:19092
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "ap-real-redpanda-${TARGET}" rpk cluster health --exit-when-healthy >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          [[ "${ready}" == true ]]
          REDPANDA_BROKERS=127.0.0.1:19092 REDPANDA_TOPIC_BOOTSTRAP_PROFILE=development \
            npm run --prefix fedify-sidecar topics:bootstrap

      - name: Start pinned remote implementation and proof router
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET}" in
            mastodon)
              fedify-sidecar/interop/ap/scripts/prepare-mastodon-env.sh
              set -a; . fedify-sidecar/interop/ap/runtime/mastodon.env; set +a
              docker compose -f "${COMPOSE_FILE}" --profile mastodon up -d mastodon-db mastodon-redis
              AP_INTEROP_MASTODON_ENV_FILE="${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/runtime/mastodon.env" \
              AP_INTEROP_MASTODON_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-mastodon-account.sh
              ;;
            gotosocial)
              rm -rf fedify-sidecar/interop/ap/runtime/gotosocial
              mkdir -p fedify-sidecar/interop/ap/runtime/gotosocial
              docker compose -f "${COMPOSE_FILE}" up -d gotosocial-app
              AP_INTEROP_GOTOSOCIAL_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-gotosocial-account.sh
              ;;
            akkoma)
              rm -rf fedify-sidecar/interop/ap/runtime/akkoma
              mkdir -p fedify-sidecar/interop/ap/runtime/akkoma/etc fedify-sidecar/interop/ap/runtime/akkoma/lib
              docker compose -f "${COMPOSE_FILE}" --profile akkoma build akkoma-app
              AP_INTEROP_AKKOMA_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-akkoma-account.sh
              ;;
            pixelfed)
              fedify-sidecar/interop/ap/scripts/build-pixelfed-fixture.sh
              fedify-sidecar/interop/ap/scripts/prepare-pixelfed-env.sh
              AP_INTEROP_COMPOSE_FILE="${COMPOSE_FILE}" AP_INTEROP_PIXELFED_OVERLAY="${PIXELFED_OVERLAY}" \
              AP_INTEROP_PIXELFED_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-pixelfed-account.sh
              ;;
            misskey)
              fedify-sidecar/interop/ap/scripts/prepare-misskey-config.sh
              AP_INTEROP_COMPOSE_FILE="${COMPOSE_FILE}" AP_INTEROP_MISSKEY_OVERLAY="${MISSKEY_OVERLAY}" \
              AP_INTEROP_MISSKEY_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-misskey-account.sh
              . fedify-sidecar/interop/ap/runtime/misskey-actor.env
              echo "TARGET_ACTOR_URI=${TARGET_ACTOR_URI}" >> "${GITHUB_ENV}"
              ;;
            friendica)
              AP_INTEROP_COMPOSE_FILE="${COMPOSE_FILE}" AP_INTEROP_FRIENDICA_OVERLAY="${FRIENDICA_OVERLAY}" \
              AP_INTEROP_FRIENDICA_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-friendica-account.sh
              ;;
            castopod)
              AP_INTEROP_COMPOSE_FILE="${COMPOSE_FILE}" AP_INTEROP_CASTOPOD_OVERLAY="${CASTOPOD_OVERLAY}" \
              AP_INTEROP_CASTOPOD_HANDLE="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-castopod-account.sh
              ;;
            bonfire)
              AP_INTEROP_COMPOSE_FILE="${COMPOSE_FILE}" AP_INTEROP_BONFIRE_OVERLAY="${BONFIRE_OVERLAY}" \
              AP_INTEROP_BONFIRE_USERNAME="${TARGET_USERNAME}" \
                fedify-sidecar/interop/ap/scripts/bootstrap-bonfire-account.sh
              ;;
            *) exit 2 ;;
          esac
          docker compose -f "${COMPOSE_FILE}" -f "${REAL_OVERLAY}" --profile real-activitypods up -d ap-proof-router
          AP_INTEROP_COMPOSE_FILE="${COMPOSE_FILE}" AP_INTEROP_REAL_OVERLAY="${REAL_OVERLAY}" \
            fedify-sidecar/interop/ap/scripts/configure-proof-router-hosts.sh "${TARGET_HOST}" "${ACTIVITYPODS_HOST}" \
            | tee "${EVIDENCE_DIR}/proof-router-hosts.json"
          readiness_uri="${TARGET_ACTOR_URI}"
          readiness_accept='application/activity+json'
          if [[ "${TARGET}" == gotosocial ]]; then
            # GoToSocial deliberately requires an HTTP signature on actor GETs.
            # Its WebFinger document is the unsigned discovery endpoint and
            # confirms that the bootstrapped account is reachable through TLS.
            readiness_uri="https://${TARGET_HOST}/.well-known/webfinger?resource=acct:${TARGET_USERNAME}@${TARGET_HOST}"
            readiness_accept='application/jrd+json'
          fi
          ready=false
          readiness_attempts=90
          # Misskey 2026.7.0's post-setup migration restart reached its actor
          # endpoint two seconds after the former seven-minute bound on the
          # hosted runner. Keep the common bound at three minutes and give only
          # the pinned Misskey fixture a bounded nine-minute startup window.
          if [[ "${TARGET}" == "misskey" ]]; then
            readiness_attempts=270
          fi
          for attempt in $(seq 1 "${readiness_attempts}"); do
            if curl --cacert fedify-sidecar/interop/ap/runtime/certs/rootCA.crt -fsS \
              -H "Accept: ${readiness_accept}" "${readiness_uri}" >/dev/null; then ready=true; break; fi
            sleep 2
          done
          [[ "${ready}" == true ]]

      - name: Start ActivityPods native mode
        working-directory: activitypods/pod-provider/backend
        shell: bash
        env:
          SEMAPPS_HOME_URL: https://${{ matrix.activitypods_host }}/
          SEMAPPS_PORT: '3000'
          SEMAPPS_SPARQL_ENDPOINT: http://127.0.0.1:3040/
          SEMAPPS_QUEUE_SERVICE_URL: redis://127.0.0.1:6379/1
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379/12
          SEMAPPS_REDIS_OIDC_PROVIDER_URL: redis://127.0.0.1:6379/13
          SEMAPPS_SMTP_HOST: 127.0.0.1
          SEMAPPS_SMTP_PORT: '1025'
          SEMAPPS_ACTIVITYPUB_REMOTE_DELIVERY_MODE: native
          SEMAPPS_ACTIVITYPUB_ALLOW_EXTERNAL_DELIVERY_PREVIEW: 'false'
          SEMAPPS_ACTIVITYPUB_EXTERNAL_AUTHORITY_CUTOVER: 'false'
          APODS_AUTO_PROVISION_ATPROTO_ON_SIGNUP: 'false'
          APODS_FORCE_COMPLETE_SIGNUP_BOOTSTRAP: 'true'
          APODS_DEFER_COMPLETE_SIGNUP_BOOTSTRAP: 'true'
          APODS_KEY_CONTAINER_WAIT_TIMEOUT_MS: '90000'
        run: |
          set -euo pipefail
          if curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 1; fi
          log="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/activitypods-native.log"
          "${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/scripts/start-real-activitypods.sh" > "${log}" 2>&1 &
          echo "$!" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/activitypods-native.pid"
          pid="$(cat "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/activitypods-native.pid")"
          ready=false
          for attempt in $(seq 1 120); do
            if ! kill -0 "${pid}" 2>/dev/null; then tail -n 500 "${log}"; exit 1; fi
            if grep -Eq 'ServiceBroker with [0-9]+ service\(s\) started successfully' "${log}" && curl -sS --max-time 2 -o /dev/null http://127.0.0.1:3000/; then ready=true; break; fi
            sleep 1
          done
          [[ "${ready}" == true ]]

      - name: Prove native federation and remote persistence
        id: native-proof
        continue-on-error: true
        working-directory: activitypods/pod-provider/backend
        shell: bash
        env:
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379/12
        run: |
          set -euo pipefail
          AP_FEDERATION_RUN_ID="${GITHUB_RUN_ID}-${TARGET}-native" \
            node scripts/activitypub-federation-follow-proof.js native "${TARGET_ACTOR_URI}" \
            | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/native-origin.log"
          tail -n 1 "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/native-origin.log" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/native-origin.json"
          actor_uri="$(node -p "JSON.parse(require('fs').readFileSync('${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/native-origin.json','utf8')).actorUri")"
          AP_INTEROP_COMPOSE_OVERLAY="${TARGET_COMPOSE_OVERLAY}" \
            sh "${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/scripts/assert-real-follow-accepted.sh" "${TARGET}" "${actor_uri}" "${TARGET_USERNAME}" \
            | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/native-acceptance.json"

      - name: Stop native ActivityPods
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat "${EVIDENCE_DIR}/activitypods-native.pid")" 2>/dev/null || true
          for attempt in $(seq 1 30); do
            if ! curl -sS --max-time 1 -o /dev/null http://127.0.0.1:3000/ 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Reset ActivityPods state between authority modes
        working-directory: activitypods/pod-provider
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose-test.yml down
          sudo rm -rf data/fuseki_test data/redis_test
          mkdir -p data/fuseki_test data/redis_test
          docker compose -f docker-compose-test.yml up -d fuseki_test redis mailcatcher
          FUSEKI_URL=http://localhost:3040 AUTH_DATASET=settings WAIT_SECONDS=90 ./scripts/fuseki-bootstrap.sh
          docker compose -f docker-compose-test.yml exec -T redis redis-cli PING

      - name: Start signer recorder and sidecar
        working-directory: fedify-sidecar
        shell: bash
        run: |
          set -euo pipefail
          : > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/signing-api.jsonl"
          AP_SIGNING_PROXY_HOST=127.0.0.1 AP_SIGNING_PROXY_PORT=3001 AP_SIGNING_PROXY_TARGET_HOST=127.0.0.1 AP_SIGNING_PROXY_TARGET_PORT=3000 \
          AP_SIGNING_PROXY_EVIDENCE_PATH="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/signing-api.jsonl" \
            node interop/ap/scripts/activitypods-signing-recording-proxy.mjs > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/signing-proxy.log" 2>&1 &
          echo "$!" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/signing-proxy.pid"
          docker compose -f "${GITHUB_WORKSPACE}/activitypods/pod-provider/docker-compose-test.yml" exec -T redis redis-cli -n 0 FLUSHDB >/dev/null
          NODE_ENV=development PORT=8080 HOST=127.0.0.1 DOMAIN="${ACTIVITYPODS_HOST}" SIDECAR_STARTUP_MODE=blocking \
          AP_INTEROP_ENABLE_MEDIA_FIXTURES=true APDM_INTEROP_PRIVATE_HOSTS="${TARGET_HOST}" \
          REDIS_URL=redis://127.0.0.1:6379 APDM_COMPLETION_MARKER_V2_CUTOVER=fresh REDPANDA_BROKERS=127.0.0.1:19092 \
          REDPANDA_ENFORCE_TOPIC_GOVERNANCE=true REDPANDA_TOPIC_BOOTSTRAP_PROFILE=development \
          STREAM1_TOPIC=ap.stream1.local-public.v1 STREAM2_TOPIC=ap.stream2.remote-public.v1 \
          FIREHOSE_TOPIC=ap.firehose.v1 TOMBSTONE_TOPIC=ap.tombstones.v1 ACTIVITYPODS_URL=http://127.0.0.1:3001 \
          ACTIVITYPODS_TOKEN="${ACTIVITYPODS_TOKEN}" SIDECAR_TOKEN="${SIDECAR_TOKEN}" ENABLE_OUTBOUND_WORKER=true ENABLE_OUTBOX_INTENT_WORKER=true \
          ENABLE_INBOUND_WORKER=false ENABLE_ORIGIN_RECONCILIATION=false ENABLE_FEDIFY_RUNTIME_INTEGRATION=false ENABLE_OPENSEARCH_INDEXER=false \
          ENABLE_XRPC_SERVER=false ENABLE_MEDIA_ASSET_SYNC=false ENABLE_ACCOUNT_PROVISIONING=false ENABLE_ENTRYWAY=false ENABLE_FOLLOWERS_SYNC=false \
          ENABLE_MRF_ADMIN_API=false ENABLE_MODERATION_BRIDGE_API=false ENABLE_CANONICAL_EVENT_LOG=false ENABLE_CANONICAL_NOTIFICATIONS=false \
          ENABLE_AT_JETSTREAM=false ENABLE_AT_EXTERNAL_FIREHOSE=false CONSUMER_GROUP=sidecar-workers INBOUND_STREAM_KEY=ap:queue:inbound:v1 \
          OUTBOUND_STREAM_KEY=ap:queue:outbound:v1 OUTBOX_INTENT_STREAM_KEY=ap:queue:outbox-intent:v1 ORIGIN_RECONCILE_STREAM_KEY=ap:queue:origin-reconcile:v1 \
          DLQ_OUTBOUND_STREAM_KEY=ap:queue:dlq:outbound:v1 REQUEST_TIMEOUT_MS=10000 \
            npm run server:dev > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/sidecar.log" 2>&1 &
          echo "$!" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/sidecar.pid"
          pid="$(cat "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/sidecar.pid")"
          ready=false
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null; then ready=true; break; fi
            if ! kill -0 "${pid}" 2>/dev/null; then tail -n 500 "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/sidecar.log"; exit 1; fi
            sleep 1
          done
          [[ "${ready}" == true ]]

      - name: Start ActivityPods external sidecar mode
        working-directory: activitypods/pod-provider/backend
        shell: bash
        env:
          SEMAPPS_HOME_URL: https://${{ matrix.activitypods_host }}/
          SEMAPPS_PORT: '3000'
          SEMAPPS_SPARQL_ENDPOINT: http://127.0.0.1:3040/
          SEMAPPS_QUEUE_SERVICE_URL: redis://127.0.0.1:6379/1
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379/12
          SEMAPPS_REDIS_OIDC_PROVIDER_URL: redis://127.0.0.1:6379/13
          SEMAPPS_SMTP_HOST: 127.0.0.1
          SEMAPPS_SMTP_PORT: '1025'
          SEMAPPS_ACTIVITYPUB_REMOTE_DELIVERY_MODE: external
          SEMAPPS_ACTIVITYPUB_ALLOW_EXTERNAL_DELIVERY_PREVIEW: 'true'
          SEMAPPS_ACTIVITYPUB_EXTERNAL_AUTHORITY_CUTOVER: 'false'
          SIDECAR_DELIVERY_HANDOFF_URL: http://127.0.0.1:8080/webhook/outbox
          APODS_AUTO_PROVISION_ATPROTO_ON_SIGNUP: 'false'
          APODS_FORCE_COMPLETE_SIGNUP_BOOTSTRAP: 'true'
          APODS_DEFER_COMPLETE_SIGNUP_BOOTSTRAP: 'true'
          APODS_KEY_CONTAINER_WAIT_TIMEOUT_MS: '90000'
        run: |
          set -euo pipefail
          log="${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/activitypods-external.log"
          "${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/scripts/start-real-activitypods.sh" > "${log}" 2>&1 &
          echo "$!" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/activitypods-external.pid"
          pid="$(cat "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/activitypods-external.pid")"
          ready=false
          for attempt in $(seq 1 120); do
            if ! kill -0 "${pid}" 2>/dev/null; then tail -n 500 "${log}"; exit 1; fi
            if grep -Eq 'ServiceBroker with [0-9]+ service\(s\) started successfully' "${log}" && curl -sS --max-time 2 -o /dev/null http://127.0.0.1:3000/; then ready=true; break; fi
            sleep 1
          done
          [[ "${ready}" == true ]]

      - name: Prove sidecar federation, remote persistence, and real ActivityPods signer
        id: external-proof
        continue-on-error: true
        working-directory: activitypods/pod-provider/backend
        shell: bash
        env:
          SEMAPPS_REDIS_TRANSPORTER_URL: redis://127.0.0.1:6379/12
        run: |
          set -euo pipefail
          AP_FEDERATION_RUN_ID="${GITHUB_RUN_ID}-${TARGET}-external" \
            node scripts/activitypub-federation-follow-proof.js external "${TARGET_ACTOR_URI}" \
            | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-origin.log"
          tail -n 1 "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-origin.log" > "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-origin.json"
          node - <<'NODE'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/' + process.env.EVIDENCE_DIR + '/external-origin.json', 'utf8'));
          if (v.ok !== true || v.mode !== 'external' || v.durableHandoffQueued !== true || v.nativeRemotePostSuppressed !== true) process.exit(1);
          NODE
          actor_uri="$(node -p "JSON.parse(require('fs').readFileSync('${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-origin.json','utf8')).actorUri")"
          AP_INTEROP_COMPOSE_OVERLAY="${TARGET_COMPOSE_OVERLAY}" \
            sh "${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/scripts/assert-real-follow-accepted.sh" "${TARGET}" "${actor_uri}" "${TARGET_USERNAME}" \
            | tee "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-acceptance.json"
          node "${GITHUB_WORKSPACE}/fedify-sidecar/interop/ap/scripts/assert-real-signing-call.mjs" \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/signing-api.jsonl" "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-origin.json" "${TARGET_HOST}" \
            "${GITHUB_WORKSPACE}/${EVIDENCE_DIR}/external-signing.json"

      - name: Build exact implementation evidence summary
        if: always()
        shell: bash
        env:
          REMOTE_VERSION: ${{ matrix.remote_version }}
          NATIVE_PROOF_OUTCOME: ${{ steps.native-proof.outcome }}
          EXTERNAL_PROOF_OUTCOME: ${{ steps.external-proof.outcome }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const root = process.env.EVIDENCE_DIR;
          const readJson = name => {
            try { return JSON.parse(fs.readFileSync(`${root}/${name}`, 'utf8')); }
            catch { return null; }
          };
          const nativeOrigin = readJson('native-origin.json');
          const nativeAcceptance = readJson('native-acceptance.json');
          const externalOrigin = readJson('external-origin.json');
          const externalAcceptance = readJson('external-acceptance.json');
          const signing = readJson('external-signing.json');
          const nativeComplete = process.env.NATIVE_PROOF_OUTCOME === 'success' &&
            nativeOrigin?.ok === true && nativeOrigin?.mode === 'native' && nativeAcceptance?.ok === true;
          const externalComplete = process.env.EXTERNAL_PROOF_OUTCOME === 'success' &&
            externalOrigin?.ok === true && externalOrigin?.mode === 'external' &&
            externalOrigin?.durableHandoffQueued === true && externalOrigin?.nativeRemotePostSuppressed === true &&
            externalAcceptance?.ok === true && signing?.ok === true &&
            signing?.activityId === externalOrigin?.activityId && signing?.actorUri === externalOrigin?.actorUri;
          const complete = nativeComplete && externalComplete;
          const summary = {
            schema: 'activitypods.activitypub.real-multi-implementation.v1',
            complete,
            target: process.env.TARGET,
            remoteVersion: process.env.REMOTE_VERSION,
            activityPodsSha: process.env.ACTIVITYPODS_SHA,
            federationSha: process.env.FEDERATION_SHA,
            native: nativeComplete
              ? { complete: true, actorUri: nativeOrigin.actorUri, activityId: nativeOrigin.activityId, persistedFollowCount: nativeAcceptance.persistedFollowCount, sidecarRunning: false }
              : { complete: false, stepOutcome: process.env.NATIVE_PROOF_OUTCOME },
            external: externalComplete
              ? { complete: true, actorUri: externalOrigin.actorUri, activityId: externalOrigin.activityId, persistedFollowCount: externalAcceptance.persistedFollowCount, durableHandoffQueued: externalOrigin.durableHandoffQueued, nativeRemotePostSuppressed: externalOrigin.nativeRemotePostSuppressed, successfulActivityPodsSigningCalls: signing.successfulSigningCalls, signerKeyIds: signing.signerKeyIds, deliveredInboxPaths: signing.deliveredInboxPaths, bodySha256Base64: signing.bodySha256Base64 }
              : { complete: false, stepOutcome: process.env.EXTERNAL_PROOF_OUTCOME }
          };
          fs.writeFileSync(`${root}/summary.json`, JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (!complete) throw new Error('both federation modes require valid remote-persistence and signer evidence');
          NODE

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activitypub-real-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: measurements/ap-real-multi/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          tail -n 500 "${EVIDENCE_DIR}/activitypods-native.log" 2>/dev/null || true
          tail -n 500 "${EVIDENCE_DIR}/activitypods-external.log" 2>/dev/null || true
          tail -n 700 "${EVIDENCE_DIR}/sidecar.log" 2>/dev/null || true
          if [[ -f "${EVIDENCE_DIR}/signing-api.jsonl" ]]; then
            echo "signing_api_record_count=$(wc -l < "${EVIDENCE_DIR}/signing-api.jsonl")"
          fi
          docker compose -f "${COMPOSE_FILE}" -f "${REAL_OVERLAY}" --profile real-activitypods logs --no-color ap-proof-router 2>/dev/null || true
          case "${TARGET}" in
            mastodon) docker compose -f "${COMPOSE_FILE}" --profile mastodon logs --no-color mastodon-web-app mastodon-sidekiq 2>/dev/null || true ;;
            gotosocial) docker compose -f "${COMPOSE_FILE}" logs --no-color gotosocial-app 2>/dev/null || true ;;
            akkoma) docker compose -f "${COMPOSE_FILE}" --profile akkoma logs --no-color akkoma-app 2>/dev/null || true ;;
            pixelfed) docker compose -f "${COMPOSE_FILE}" -f "${PIXELFED_OVERLAY}" logs --no-color pixelfed-app pixelfed-horizon 2>/dev/null || true ;;
            misskey) docker compose -f "${COMPOSE_FILE}" -f "${MISSKEY_OVERLAY}" logs --no-color misskey-app misskey-db 2>/dev/null || true ;;
            # Friendica's invalid-signature log context includes complete
            # request headers and bodies. The persistence assertion emits only
            # fixed-message counters, so never dump raw Friendica logs here.
            friendica) docker compose -f "${COMPOSE_FILE}" -f "${FRIENDICA_OVERLAY}" ps friendica-app friendica-worker 2>/dev/null || true ;;
            castopod) docker compose -f "${COMPOSE_FILE}" -f "${CASTOPOD_OVERLAY}" logs --no-color castopod-app castopod-db 2>/dev/null || true ;;
            bonfire) docker compose -f "${COMPOSE_FILE}" -f "${BONFIRE_OVERLAY}" logs --no-color bonfire-app 2>/dev/null || true ;;
          esac

      - name: Stop isolated fixture
        if: always()
        shell: bash
        run: |
          set +e
          for file in activitypods-external.pid activitypods-native.pid sidecar.pid signing-proxy.pid; do
            if [[ -f "${EVIDENCE_DIR}/${file}" ]]; then kill "$(cat "${EVIDENCE_DIR}/${file}")" 2>/dev/null || true; fi
          done
          docker rm -f "ap-real-redpanda-${TARGET}" >/dev/null 2>&1 || true
          docker compose -f "${COMPOSE_FILE}" -f "${REAL_OVERLAY}" --profile real-activitypods down -v || true
          if [[ "${TARGET}" == pixelfed ]]; then
            docker compose -f "${COMPOSE_FILE}" -f "${PIXELFED_OVERLAY}" down -v || true
          fi
          if [[ "${TARGET}" == misskey ]]; then
            docker compose -f "${COMPOSE_FILE}" -f "${MISSKEY_OVERLAY}" down -v || true
          fi
          if [[ "${TARGET}" == friendica ]]; then
            docker compose -f "${COMPOSE_FILE}" -f "${FRIENDICA_OVERLAY}" down -v || true
          fi
          if [[ "${TARGET}" == castopod ]]; then
            docker compose -f "${COMPOSE_FILE}" -f "${CASTOPOD_OVERLAY}" down -v || true
          fi
          if [[ "${TARGET}" == bonfire ]]; then
            docker compose -f "${COMPOSE_FILE}" -f "${BONFIRE_OVERLAY}" down -v || true
          fi
          docker compose -f "${COMPOSE_FILE}" --profile mastodon --profile akkoma down -v || true
          cd activitypods/pod-provider
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test data/redis_test
