name: Paper staging foundation
on:
  pull_request:
    paths:
      - 'deploy/paper-staging/**'
      - '.github/workflows/paper-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned ActivityPods source
        run: |
          git init "$RUNNER_TEMP/activitypods"
          git -C "$RUNNER_TEMP/activitypods" remote add origin https://github.com/outlaw-dame/activity-pods.git
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          commit = json.loads(Path("deploy/paper-staging/lock.json").read_text())["activitypods"]
          if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Invalid ActivityPods source pin")
          subprocess.run(["git", "-C", os.path.join(os.environ["RUNNER_TEMP"], "activitypods"),
                          "fetch", "--depth=1", "origin", commit], check=True, timeout=120)
          PYTHON
      - name: Prepare and validate actual provider profile
        run: |
          python3 deploy/paper-staging/prepare.py "$RUNNER_TEMP/paper-provider" --activitypods-checkout "$RUNNER_TEMP/activitypods"
          docker compose -f "$RUNNER_TEMP/paper-provider/compose.json" --profile provider --profile storage-proof config --quiet
      - name: Verify protected credentials are absent from ordinary provider
        run: |
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "paper-provider"
          cfg = json.loads((root / "compose.json").read_text())
          assert json.loads((root / "lock.json").read_text())["release"] == "CLOSED"
          provider = cfg["services"]["provider"]
          protected = cfg["services"]["protected-fuseki"]
          probe = cfg["services"]["protected-storage-proof"]
          assert "ports" not in protected and "ports" not in probe
          assert protected["networks"] == ["protected-authority"]
          assert probe["networks"] == ["protected-authority"]
          assert cfg["networks"]["protected-authority"]["internal"] is True
          assert cfg["networks"]["authority"]["internal"] is True
          assert "protected-authority" not in provider["networks"]
          assert probe["read_only"] is True and probe["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in probe["security_opt"]
          assert probe["user"] == "0:0"  # Ephemeral only; reads owner-private 0600 files
          for file in ("protected-access.json", "protected-shiro.ini"):
              assert stat.S_IMODE((root / "secrets" / file).stat().st_mode) == 0o600
          ordinary_mounts = " ".join(provider["volumes"])
          ordinary_environment = json.dumps(provider["environment"])
          assert "protected-access" not in ordinary_mounts
          assert "protected-shiro" not in ordinary_mounts
          assert "protected-fuseki" not in ordinary_environment
          assert "protected-storage-proof" not in ordinary_environment
          print("PASS: protected Jena secrets are owner-private and absent from ordinary provider")
          PY
      - name: Build actual provider and frontend
        run: docker compose -f "$RUNNER_TEMP/paper-provider/compose.json" --profile provider build provider frontend
      - name: Verify HTTPS surfaces and closed signup gate
        run: |
          docker compose -f "$RUNNER_TEMP/paper-provider/compose.json" --profile provider up -d ingress
          docker compose -f "$RUNNER_TEMP/paper-provider/compose.json" exec -T provider node /staging/provider-probe.mjs
          curl --fail --silent --show-error --max-time 10 --cacert "$RUNNER_TEMP/paper-provider/certificates/ca.crt" \
            --resolve provider.paper.example.org:8443:127.0.0.1 https://provider.paper.example.org:8443/_staging/ready
          curl --fail --silent --show-error --max-time 10 --cacert "$RUNNER_TEMP/paper-provider/certificates/ca.crt" \
            --resolve login.paper.example.org:8443:127.0.0.1 https://login.paper.example.org:8443/login --output /dev/null
      - name: Prove physical protected Jena credential isolation
        run: |
          set -euo pipefail
          compose="$RUNNER_TEMP/paper-provider/compose.json"
          docker compose -f "$compose" --profile storage-proof up -d --wait --wait-timeout 120 protected-fuseki
          docker compose -f "$compose" --profile storage-proof run --rm protected-storage-proof prepare
      - name: Restart provider and storage without rotating OIDC signing keys
        run: |
          set -euo pipefail
          compose="$RUNNER_TEMP/paper-provider/compose.json"
          before="$RUNNER_TEMP/paper-provider-jwks-before.log"
          after="$RUNNER_TEMP/paper-provider-jwks-after.log"
          docker compose -f "$compose" exec -T provider node /staging/provider-probe.mjs | tee "$before"
          docker compose -f "$compose" --profile provider restart redis fuseki
          docker compose -f "$compose" --profile provider up -d --wait --wait-timeout 120 redis fuseki
          docker compose -f "$compose" --profile provider restart provider
          docker compose -f "$compose" exec -T provider node /staging/provider-probe.mjs | tee "$after"
          before_fp="$(grep -E '^STAGING_OIDC_JWKS_SHA256=[0-9a-f]{64}$' "$before")"
          after_fp="$(grep -E '^STAGING_OIDC_JWKS_SHA256=[0-9a-f]{64}$' "$after")"
          test "$(grep -c '^STAGING_OIDC_JWKS_SHA256=' "$before")" -eq 1
          test "$(grep -c '^STAGING_OIDC_JWKS_SHA256=' "$after")" -eq 1
          if test "$before_fp" != "$after_fp"; then
            echo "::error::OIDC public signing key continuity failed after provider/storage restart"
            exit 1
          fi
          echo "Verified OIDC public signing keys persist after provider, Redis and Fuseki restart; signup remains CLOSED."
      - name: Prove protected RDF survives restart without granting ordinary write access
        run: |
          set -euo pipefail
          compose="$RUNNER_TEMP/paper-provider/compose.json"
          docker compose -f "$compose" --profile storage-proof restart protected-fuseki
          docker compose -f "$compose" --profile storage-proof up -d --wait --wait-timeout 120 protected-fuseki
          docker compose -f "$compose" --profile storage-proof run --rm protected-storage-proof verify
      - name: Diagnose provider failure without publishing secrets
        if: failure()
        run: python3 deploy/paper-staging/diagnose.py "$RUNNER_TEMP/paper-provider"
      - name: Cleanup this disposable provider
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/paper-provider/PREPARED"; then
            docker compose -f "$RUNNER_TEMP/paper-provider/compose.json" --profile provider --profile storage-proof down --volumes
          fi
  tls-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s deploy/paper-staging -p 'test_*.py'
      - run: python3 deploy/paper-staging/prepare.py "$RUNNER_TEMP/paper-staging"
      - name: Validate deployment configuration
        run: docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" --profile acceptance config --quiet
      - name: Build exact pinned source and exercise TLS runtime
        run: |
          docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" --profile acceptance build acceptance
          docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" up -d --wait --wait-timeout 120 postgres
          docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" --profile acceptance run --rm acceptance
      - name: Restart without remigrating or rotating secrets
        run: |
          docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" restart postgres
          docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" up -d --wait --wait-timeout 120 postgres
          docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" --profile acceptance run --rm acceptance
      - name: Bounded sanitized database diagnostics
        if: failure()
        run: python3 deploy/paper-staging/diagnose.py "$RUNNER_TEMP/paper-staging"
      - name: Remove this job's disposable resources
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/paper-staging/PREPARED"; then
            docker compose -f "$RUNNER_TEMP/paper-staging/compose.json" --profile acceptance down --volumes
          fi
